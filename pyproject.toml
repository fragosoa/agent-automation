[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-automation"
version = "0.1.0"
description = "Personal AI agent orchestration system"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Config
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # AI
    "anthropic>=0.30.0",
    "litellm>=1.40.0",
    # Telegram
    "python-telegram-bot>=21.0",
    # Git
    "gitpython>=3.1.43",
    "PyGithub>=2.3.0",
    # Utils
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
