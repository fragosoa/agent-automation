services:

  # ──────────────────────────────────────────────
  # Redis — broker de Celery y cache
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # API — FastAPI backend
  # ──────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    command: uvicorn core.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - workspace:/workspace/repos
    depends_on:
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Worker — Celery worker que ejecuta los agentes
  # ──────────────────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    command: celery -A core.queue.worker.celery_app worker --loglevel=info --concurrency=3
    env_file: .env
    volumes:
      - .:/app
      - workspace:/workspace/repos
    depends_on:
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Telegram Bot — canal de instrucciones
  # ──────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    command: python -m channels.telegram_bot
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - api

volumes:
  redis_data:
  workspace:
